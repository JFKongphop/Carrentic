# fly.toml app configuration file generated for carrentic on 2026-09-11T21:03:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'carrentic'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/cfo.db'
  HEDERA_NETWORK = 'testnet'
  OPENAI_MODEL = 'gpt-4o-mini'
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
